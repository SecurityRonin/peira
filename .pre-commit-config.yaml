# Parity with .github/workflows/ci.yml — same commands, same flags. A local hook
# that runs a weaker check than CI trains you to trust a green that means less
# than the one that gates the merge.
#
# The acceptance controls are not restated here: both this file and the CI job
# call tests/controls.sh, so there is one copy to drift from.
#
# `cargo vet` runs here ONLY in its offline form. The networked check needs to
# fetch imported audit sets, and a hook that fails on a flaky DNS lookup gets
# disabled within a week — CI still owns that one. `--locked --frozen` avoids the
# network entirely and still catches the store-consistency class, which is what
# actually broke: a crate rename left the `[policy.*]` entries out of alphabetical
# order, every local check passed, and CI went red on ordering alone.
#
# Proved it can fail before trusting it: with the entries swapped back out of
# order the offline check exits 255 with the same "store has consistency errors"
# it produced in CI.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-features --no-fail-fast
        language: system
        types: [rust]
        pass_filenames: false

      - id: peira-controls
        name: acceptance controls (A blocks, B passes, C is distinguishable)
        entry: bash -c 'cargo build -q -p peira-cli && tests/controls.sh target/debug/peira'
        language: system
        pass_filenames: false
        files: (\.rs$|^tests/|^Cargo\.(toml|lock)$)

      - id: cargo-deny
        name: cargo deny
        entry: cargo deny check advisories bans licenses sources
        language: system
        files: (Cargo\.toml|Cargo\.lock|deny\.toml)
        pass_filenames: false

      - id: cargo-vet-store
        name: cargo vet (store consistency, offline)
        entry: cargo vet --locked --frozen
        language: system
        files: (Cargo\.(toml|lock)|^supply-chain/)
        pass_filenames: false

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
