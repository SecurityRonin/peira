[package]
name = "peira-lens"
version = "0.1.1"
description = "The peira lens catalogue — classical critical-thinking examinations (Socratic, Toulmin, catuskoti, 體用, 白馬非馬, Ship of Theseus) as typed, cited, machine-checkable gates."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["critical-thinking", "argumentation", "epistemics", "dialectic", "logic"]
categories = ["data-structures"]

# The CATALOGUE keeps forensicnomicon's knowledge-leaf discipline — `static`/`const`
# memory, no I/O, no database, no runtime parse step, so a malformed catalogue is a
# compile error and matches stay exhaustive. The crate is not literally dependency-
# free, though: a gate predicate has to see the graph it judges, so it takes the node
# and edge types from peira-core. Claiming "zero dependencies" here would be the
# kind of overstatement this project exists to catch.
[dependencies]
peira-core = { workspace = true }

[lints]
workspace = true
