# Deliberately ZERO runtime dependencies, mirroring forensicnomicon's knowledge
# leaf: the catalogue compiles to `static`/`const` memory. No I/O, no database,
# no runtime parse step — so a malformed catalogue is a compile error, matches are
# exhaustive at compile time, and the catalogue is auditable as source.
