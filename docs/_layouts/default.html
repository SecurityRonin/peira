<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-head">
    <a class="brand" href="{{ '/' | relative_url }}">peira</a>
    <nav>
      <a href="{{ '/doors/' | relative_url }}">The seven doors</a>
      <a href="{{ '/lenses/' | relative_url }}">The lenses</a>
      <a href="{{ '/method/' | relative_url }}">The method</a>
      <a href="https://github.com/SecurityRonin/peira">GitHub</a>
    </nav>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-foot">
    <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
    <a href="{{ '/terms/' | relative_url }}">Terms</a> ·
    © Security Ronin Ltd
  </footer>

  <!-- Render kramdown ```mermaid fences (emitted as <code class="language-mermaid">). -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    (function () {
      document.querySelectorAll('pre > code.language-mermaid').forEach(function (c) {
        var d = document.createElement('div');
        d.className = 'mermaid';
        d.textContent = c.textContent;
        c.parentElement.replaceWith(d);
      });
      if (window.mermaid) {
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'default' });
      }
    })();
  </script>
</body>
</html>
