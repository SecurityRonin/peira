[package]
name = "peira-index"
version = "0.1.1"
description = "A derived, disposable SQLite index over a peira vault — rebuilt from committed markdown, never authoritative, never committed."
edition.workspace = true
# 1.88, INHERITED and not this code's own floor. peira-index gained a
# peira-citation dependency (one implementation of "what blocks a claim",
# shared with the CLI), and citation carries blazehash-core's 1.88. It
# declared 1.85 for exactly as long as nothing checked it.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["knowledge-management", "sqlite", "index", "query", "graph"]
categories = ["database"]

[dependencies]
peira-core = { workspace = true }
peira-lens = { workspace = true }
# The index must ask the SAME question the CLI does about what blocks a claim.
# It re-derived a narrower one and its violations table silently omitted
# everything a packet would seal.
peira-citation = { workspace = true }
# `bundled` compiles SQLite in, per the batteries-included rule: a capability not
# compiled in is not there in the field, and an index that depends on whichever
# libsqlite3 the host happens to ship is not reproducible.
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true
