[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# No `ignore` list. A suppression here is a last resort after a real fix is proven
# unavailable, and it must carry the reason and the condition for removing it.
ignore = []

[licenses]
version = 2
# Kept in step with the fleet's own list (blazehash's deny.toml), so a dependency
# that is acceptable there does not become a blocker here for no reason.
#
# CC0-1.0 and BSL-1.0 were added after `cargo deny` rejected tiny-keccak and
# xxhash-rust, both reached through blazehash-core. Both are permissive and
# OSI/FSF-recognised, so the prescribed fix is to allow the licence rather than
# to drop the capability: `default-features = false` is banned as a way to dodge
# a gate.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Never hand-rolled, and never a "simplified" stand-in: a placeholder digest
    # returns plausible-but-wrong bytes, which fabricates evidence.
    { name = "md5", reason = "use blazehash-core, which wraps the audited RustCrypto md-5" },
    # The archived serde_yaml. serde_yaml_ng is the maintained fork; see ADR-0005.
    { name = "serde_yaml", reason = "archived upstream; use serde_yaml_ng" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
