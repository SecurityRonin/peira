[package]
name = "peira-citation"
version = "0.1.0"
description = "Court Mode for peira — frozen, hash-verified citation packets whose safe statement is generated from the graph rather than authored."
edition.workspace = true
# NOT the workspace floor. blazehash-core declares 1.88, and that constraint lands
# here — where the dependency is actually used — rather than being propagated up
# into peira-core and peira-lens, whose low floor is a promise downstream
# consumers pin against. Fix the constraint at its root; do not let it travel.
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["provenance", "citation", "expert-witness", "audit", "chain-of-custody"]
categories = ["data-structures"]

[dependencies]
peira-core = { workspace = true }
peira-lens = { workspace = true }
# Ours (ADR-0010): 27 algorithms behind one `hash_bytes`, and never a hand-rolled
# digest.
blazehash-core = "0.2"

[lints]
workspace = true
