[package]
name = "elenchus-cli"
version = "0.1.0"
description = "elenchus — examine a knowledge vault against classical critical-thinking gates, and export court-ready citation packets."
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["knowledge-management", "critical-thinking", "argumentation", "cli", "provenance"]
categories = ["command-line-utilities"]
default-run = "elenchus"

[[bin]]
name = "elenchus"
path = "src/main.rs"

[dependencies]
elenchus-core = { workspace = true }
elenchus-lens = { workspace = true }
elenchus-court = { workspace = true }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
