[package]
name = "peira-cli"
version = "0.1.0"
description = "peira — examine a knowledge vault against classical critical-thinking gates, and export court-ready citation packets."
edition.workspace = true
rust-version = "1.88"
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["knowledge-management", "critical-thinking", "argumentation", "cli", "provenance"]
categories = ["command-line-utilities"]
default-run = "peira"

[[bin]]
name = "peira"
path = "src/main.rs"

[dependencies]
peira-core = { workspace = true }
peira-lens = { workspace = true }
peira-court = { workspace = true }
peira-index = { workspace = true }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
