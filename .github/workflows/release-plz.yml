name: release-plz

# Owns crates.io publishing + changelogs + version bumps for the workspace LIBRARIES
# (peira-core, peira-lens, peira-citation, peira-index). Configuration lives in
# release-plz.toml.
#
# On every push to main:
#   - release-plz-pr:      opens/updates a human-reviewed version-bump PR
#   - release-plz-release: publishes any crate whose version is ahead of crates.io
#                          (release-plz resolves dependency order) and tags it
#
# Binary distribution (the peira MSI/deb/Homebrew/winget assets) and the peira-cli
# crate publish stay in release.yml, triggered by a manual `v[0-9]*` tag. The two
# pipelines do not overlap: release-plz uses package-prefixed tags
# (peira-core-v*, …), which never match `v[0-9]*` because a letter follows the `v`.
#
# Merge the release PR with a MERGE commit, never a squash — squashing rewrites the
# version-bump commit release-plz keys on.

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches: [main]

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-latest
    # Publishing is opt-in, and stays opt-in. release-plz publishes any crate whose
    # version is not on crates.io — so on a repo that has never published, the FIRST
    # run publishes immediately, with no prior version to compute a bump from and
    # therefore no release PR to review. That inverts the reason this pipeline
    # exists: the PR is the one reviewable checkpoint before an irreversible publish.
    #
    # The PR job below still runs, so you can always see what WOULD be published.
    # To arm publishing:
    #   gh variable set RELEASE_PLZ_PUBLISH --body true -R SecurityRonin/peira
    if: vars.RELEASE_PLZ_PUBLISH == 'true'
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: release-plz release
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-plz PR
    runs-on: ubuntu-latest
    # Serialize PR updates so concurrent pushes don't fight over the release PR.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: release-plz release-pr
        uses: release-plz/action@e8792575c7f2366cf6ff3ccc33ead9ace5b691c7 # v0.5.130
        with:
          command: release-pr
        env:
          # PRs created with the built-in GITHUB_TOKEN do NOT trigger other
          # workflows, so CI would never run on the release PR — the one PR where a
          # green check matters most, since merging it publishes irreversibly.
          # RELEASE_PLZ_TOKEN is an org secret and this repo inherits it.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
