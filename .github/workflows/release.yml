name: Release

# Binary distribution for the `peira` CLI, plus the `peira-cli` crates.io publish.
# The four LIBRARIES are not touched here — release-plz owns them (release-plz.yml).
#
# The trigger is `v[0-9]*`, never `v*`. release-plz cuts per-crate library tags
# `<crate>-vX.Y.Z`, and a `v*` glob would wrongly match any crate whose name starts
# with `v`, firing a full binary build on a library publish. Requiring a digit right
# after the `v` matches bare `vX.Y.Z` and never `<name>-v…`, because a crate name's
# first character is a letter. Its complement is `git_tag_name` in release-plz.toml;
# both controls are required, neither is sufficient alone.
on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write

jobs:
  # ONE source for the toolchain version, so the installed cross targets and the
  # compiler that uses them cannot drift apart.
  #
  # This release failed on every cross target with `E0463: can't find crate for
  # core` while both HOST targets built fine. The cause is precedence, not the
  # toolchain: the action was given no `toolchain:` input, so it installed the
  # target for whatever it defaults to, while `cargo build` obeyed
  # rust-toolchain.toml's 1.96.0 -- which had no such target installed. A channel
  # ref loses to the toml; an explicit version ref wins. Host targets never needed
  # an install, which is exactly why they passed and hid it.
  pin:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - id: read
        run: |
          channel=$(grep -E '^channel' rust-toolchain.toml | cut -d'"' -f2)
          [ -n "$channel" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "release builds on $channel"

  build:
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ needs.pin.outputs.channel }}
          targets: ${{ matrix.target }}

      # zig as the C cross-compiler for musl, replacing musl-tools plus a glibc
      # cross-gcc. That combination built aarch64-unknown-linux-musl and then failed
      # to link it: the bundled SQLite was compiled by `aarch64-linux-gnu-gcc`, a
      # GLIBC compiler, and linked against musl -- so `__memset_chk`, `__memcpy_chk`,
      # `stat64` and `fstat64` were all undefined. musl has no fortified `_chk`
      # variants and no LFS64 aliases. x86_64 passed only because `musl-tools` ships
      # a real `musl-gcc` and there is no aarch64 equivalent to install.
      #
      # Verified on an aarch64 host before landing: both musl targets build, and the
      # aarch64 artifact is statically linked and runs (`peira --version`, and the
      # bounded fixture gates clean).
      - name: Install zig and cargo-zigbuild (musl targets)
        if: contains(matrix.target, 'musl')
        run: |
          # cargo-zigbuild needs a `zig` EXECUTABLE on PATH. The pip package ships the
          # compiler as a module with no entry point, so a bare `pip install ziglang`
          # leaves cargo-zigbuild reporting "could not execute command" -- checked,
          # not assumed. Three lines of shim beat adding another third-party action
          # to the release path.
          python3 -m pip install --break-system-packages ziglang
          printf '#!/bin/sh\nexec python3 -m ziglang "$@"\n' | sudo tee /usr/local/bin/zig >/dev/null
          sudo chmod +x /usr/local/bin/zig
          zig version
          cargo install cargo-zigbuild --locked
      - name: Build (musl, via zig)
        if: contains(matrix.target, 'musl')
        run: cargo zigbuild --release -p peira-cli --target ${{ matrix.target }}
      - name: Build
        if: "!contains(matrix.target, 'musl')"
        run: cargo build --release -p peira-cli --target ${{ matrix.target }}

      - name: Azure login (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@93381592711f247e165c389ebb30b596c84cdc48 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign Windows .exe (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: securityronin
          certificate-profile-name: securityronin-public
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../peira-${{ steps.version.outputs.version }}-${{ matrix.target }}.tar.gz peira

      # Ship the bare .exe as well as the MSI. If the MSI step ever fails, a working
      # binary still reaches the release rather than the whole Windows target
      # producing nothing.
      - name: Package exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/peira.exe `
            -DestinationPath peira-${{ steps.version.outputs.version }}-${{ matrix.target }}.zip

      - name: Install cargo-wix (Windows)
        if: runner.os == 'Windows'
        run: cargo install cargo-wix --version 0.3.9 --locked

      # This repo is a VIRTUAL workspace (no root [package]), which changes the
      # invocation: a trailing positional would be parsed as a Cargo.toml path and
      # fail with "does not appear to be a Cargo.toml file". `--package` selects the
      # crate and `--include` points at the wxs, whose Source= paths are repo-root
      # relative for the same reason.
      - name: Build MSI (Windows)
        if: runner.os == 'Windows'
        run: >
          cargo wix --no-build --nocapture
          --package peira-cli
          --include wix/main.wxs
          --target ${{ matrix.target }}
          --output peira-${{ steps.version.outputs.version }}-${{ matrix.target }}.msi

      - name: Sign Windows .msi (Azure Trusted Signing)
        if: runner.os == 'Windows'
        uses: azure/trusted-signing-action@208f8af4bf26cf2af8597424e3cb5582801523ba # v2.0.0
        with:
          endpoint: https://neu.codesigning.azure.net
          trusted-signing-account-name: securityronin
          certificate-profile-name: securityronin-public
          files-folder: ${{ github.workspace }}
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # `always()`: a good binary uploads even if MSI packaging or signing failed.
        if: always()
        with:
          name: peira-${{ steps.version.outputs.version }}-${{ matrix.target }}
          path: peira-${{ steps.version.outputs.version }}-${{ matrix.target }}.*
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: 'peira-*-*-*'
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: |
            artifacts/peira-*
            artifacts/checksums.txt
          generate_release_notes: true

      - name: Dispatch to homebrew tap
        # Needs an `update-peira` handler in SecurityRonin/homebrew-tap. Non-fatal
        # until that exists, so a missing handler cannot sink a good release.
        continue-on-error: true
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0 # v3.0.0
        with:
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          repository: SecurityRonin/homebrew-tap
          event-type: update-peira
          client-payload: '{"version": "${{ github.ref_name }}"}'

  crate:
    needs: [release, pin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ needs.pin.outputs.channel }}
      # ONLY the CLI. The four libraries are owned by release-plz; scoping to
      # `-p peira-cli` keeps the tag pipeline from re-publishing (and colliding
      # with) a library version release-plz already handled.
      - name: Publish peira-cli to crates.io
        run: |
          output=$(cargo publish -p peira-cli 2>&1) && echo "$output" || {
            echo "$output"
            echo "$output" | grep -q "already exists on crates.io" || exit 1
            echo "Version already published to crates.io, skipping"
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  winget:
    needs: release
    runs-on: windows-latest
    # The action does UPDATES only — the FIRST version must be submitted to
    # microsoft/winget-pkgs by hand. Non-fatal until that bootstrap has happened.
    continue-on-error: true
    steps:
      - uses: vedantmgoyal9/winget-releaser@4ffc7888bffd451b357355dc214d43bb9f23917e # v2
        with:
          identifier: SecurityRonin.peira
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_TOKEN }}
          fork-user: securityronin-bot

  deb:
    needs: pin
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            arch: amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: ${{ needs.pin.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 2.11.2 --locked

      - name: Build .deb package
        run: cargo deb -p peira-cli --target ${{ matrix.target }}

      - name: Find .deb file
        id: find_deb
        run: |
          DEB_FILE=$(find target/${{ matrix.target }}/debian -name '*.deb' | head -1)
          test -n "$DEB_FILE" || { echo "::error::cargo-deb produced no .deb"; exit 1; }
          echo "deb_path=$DEB_FILE" >> $GITHUB_OUTPUT

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: peira-${{ matrix.arch }}.deb
          path: ${{ steps.find_deb.outputs.deb_path }}

  release-deb:
    needs: [release, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: peira-*.deb
          path: debs
          merge-multiple: true

      - name: Upload .deb to release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2.6.1
        with:
          files: debs/*.deb

  cloudsmith:
    needs: release-deb
    runs-on: ubuntu-latest
    # Needs a `securityronin/peira` repository to exist on Cloudsmith. Non-fatal
    # until it does — the .deb is already on the GitHub Release either way.
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: peira-*.deb
          path: debs
          merge-multiple: true

      - name: Install Cloudsmith CLI
        run: |
          pip install --user cloudsmith-cli==1.16.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Push amd64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/peira/any-distro/any-version debs/peira_*_amd64.deb

      - name: Push arm64 to Cloudsmith
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
        run: cloudsmith push deb securityronin/peira/any-distro/any-version debs/peira_*_arm64.deb
