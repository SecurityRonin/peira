name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The lens pages and the doors page are COMPILED from the catalogue by
  # cli/examples/gen_site.rs. This job re-runs the generator and fails if the committed
  # output differs — the same lock as `cargo fmt --check`, so the site cannot drift from
  # lens/src/lib.rs. Runs on every push and PR.
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
      - name: Regenerate the site from the catalogue
        run: cargo run -q -p peira-cli --example gen_site -- docs
      - name: Fail if the committed pages or skill drifted from the catalogue
        run: |
          # Stage first so a NEW lens page (untracked) is caught, not only a modified one.
          git add -A -- docs/lenses docs/doors.md .claude/skills/peira
          if ! git diff --cached --quiet -- docs/lenses docs/doors.md .claude/skills/peira; then
            echo "::error::docs/lenses, docs/doors.md or .claude/skills/peira is out of date — run:"
            echo "::error::  cargo run -p peira-cli --example gen_site -- docs"
            echo "::error::and commit the result."
            git diff --cached -- docs/lenses docs/doors.md .claude/skills/peira | head -80
            exit 1
          fi

  # Build on every push and PR so a Jekyll/Liquid error is caught before merge, not
  # only at deploy. baseurl lives in _config.yml, so configure-pages is not needed.
  build:
    needs: drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
