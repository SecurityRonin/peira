name: CI

on:
  push:
    branches: [main]
  pull_request:

# Actions are pinned to full commit SHAs, not floating tags: a tag can be moved
# under you, and a supply-chain gate that trusts a mutable ref is not a gate.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          components: clippy
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
      # --no-fail-fast: cargo abandons remaining targets after a failure, so a
      # total compared across two trees would be a count of different test sets.
      - run: cargo test --workspace --all-features --no-fail-fast

  # The acceptance test as a BLOCKING gate, asserting on exit codes rather than
  # on log text. Control A must block and control B must pass: a checker that
  # blocks everything and one that works are indistinguishable from A alone.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
      - run: cargo build --release -p peira-cli
      # The controls live in tests/controls.sh so this job and the pre-commit hook
      # run the same bytes. Inlined here they would drift from the local copy, and
      # a drifted control still reports green.
      - run: ./tests/controls.sh target/release/peira

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # EVERY declared floor is checked, because an unchecked one is a claim.
      # peira-index declared 1.85 while depending on peira-citation, which carries
      # blazehash-core's 1.88 -- a floor its own graph could not satisfy, which is
      # worse than an overstated one because it fails for CONSUMERS. It survived
      # because this job checked two of the five crates.
      #
      # Both floors are INHERITED, not this code's own: 1.85 from indexmap 2.14
      # (edition2024, via serde_yaml_ng) and 1.88 from blazehash-core. Measured
      # 2026-08-24: with indexmap pinned back to 2.11.4, core and lens compile on
      # 1.80 -- so the real floor of our code is lower, and unreachable while the
      # graph resolves as it does. See docs/decisions/0005.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.85"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: "1.88"
      # `cargo +VERSION`, never a bare `cargo`. rust-toolchain.toml pins 1.96.0 and
      # OUTRANKS `rustup default`, so a bare `cargo check` in this repo silently runs
      # on 1.96 whatever this job installed -- which is how the negative control below
      # went red on its first run: peira-index "compiled on 1.85" because it was never
      # 1.85. Precedence: `cargo +X` > RUSTUP_TOOLCHAIN > rust-toolchain.toml.
      #
      # The version is asserted before anything is compiled, so a job that quietly
      # moves to another toolchain fails instead of reporting a floor it never tested.
      - name: the toolchains are the ones this job claims
        run: |
          for v in 1.85 1.88; do
            got=$(cargo +$v --version | sed -E 's/^cargo ([0-9]+\.[0-9]+).*/\1/')
            [ "$got" = "$v" ] || { echo "::error::asked for $v, got $got"; exit 1; }
            echo "cargo +$v -> $got"
          done
      - run: cargo +1.85 check -p peira-core -p peira-lens --all-features
      # The NEGATIVE control, and it is the reason this job means anything: peira-index
      # must be REFUSED at 1.85. If it ever compiles, either the citation dependency is
      # gone or the declaration has drifted back down into a promise its graph cannot
      # keep. A floor nothing refuses is a floor nobody measured.
      - name: 1.85 refuses the crates that declare 1.88
        run: |
          if cargo +1.85 check -p peira-index --all-features 2>/dev/null; then
            echo "::error::peira-index compiled on 1.85 but declares 1.88 -- the floor has drifted"
            exit 1
          fi
          echo "1.85 correctly refuses peira-index"
      - run: cargo +1.88 check -p peira-index -p peira-citation -p peira-cli --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check advisories bans licenses sources

  # `deny` covers known-bad — advisories, licenses, sources. `vet` covers the
  # layer it cannot see: code nobody has read. Every dependency version must be
  # human-source-reviewed or covered by an imported aggregate audit set
  # (Google / Mozilla / Bytecode-Alliance / Embark).
  vet:
    name: cargo vet (supply-chain)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad
        with:
          tool: cargo-vet
      - run: cargo fetch
      - run: cargo vet --locked

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: a secret removed in a later commit is still fetchable by
          # SHA, so scanning only the tip scans the wrong thing.
          fetch-depth: 0
      # gitleaks-action v2+ demands a paid GITLEAKS_LICENSE for org repos; the
      # upstream binary is unrestricted, so download and run it directly.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Three scans, because each is blind to what the others see.
      - name: History
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner
      - name: Working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner
      # Neither of the above reads commit MESSAGES — they scan diff and blob
      # content only. A backticked or pasted credential in a message is therefore
      # structurally invisible to them, and is exactly the kind that reaches a
      # public repo. Verified: with the secret removed from the file and left only
      # in a message, `gitleaks git` returns clean and this returns 1.
      - name: Commit messages
        run: git log --format=%B | gitleaks stdin --config .gitleaks.toml --redact --no-banner

  # The vault is untrusted input — a hand-edited markdown tree, and later a corpus
  # an adversary may shape. `unwrap_used`/`expect_used` are denied in production
  # code, which removes the obvious panics; fuzzing is what finds the rest.
  # A short smoke run per target, so this gates PRs rather than replacing a
  # long-running campaign.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad
        with:
          tool: cargo-fuzz
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
        with:
          workspaces: |
            .
            fuzz
      # Two things this line cannot omit, both of which failed on the first run:
      #
      # `cargo +nightly`, not a bare `cargo` — rust-toolchain.toml pins 1.96.0, and
      # a CHANNEL ref from the setup action loses to the toml (only an explicit
      # version ref outranks it), so a bare cargo fails on `-Zsanitizer=address`.
      #
      # An explicit `--target` — cargo-fuzz defaults to the triple IT was built
      # for, not the host it is running on. install-action ships a musl build, so
      # the default became x86_64-unknown-linux-musl and the job died on
      # "sanitizer is incompatible with statically linked libc". The host is asked
      # for rather than hardcoded, so this stays correct on a runner of any arch.
      - run: |
          set -euo pipefail
          HOST=$(rustc +nightly -vV | awk '/^host:/{print $2}')
          echo "fuzzing on host target: $HOST"
          for t in $(cargo +nightly fuzz list); do
            echo "::group::$t"
            cargo +nightly fuzz run "$t" --target "$HOST" -- -max_total_time=60 -rss_limit_mb=4096
            echo "::endgroup::"
          done

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.96.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@59012be0884e296ca2da49b530610e72c49039ad
        with:
          tool: cargo-llvm-cov
      - uses: Swatinem/rust-cache@9bdad043e88c75890e36ad3bbc8d27f0090dd609
      # --workspace, never --lib: --lib builds only the lib's own unit tests and
      # so cannot see integration-test coverage. --workspace selects packages,
      # not targets, and does not compensate for that.
      # --fail-under-lines is what makes this a GATE. Without a threshold the job
      # only proves the tool ran, and a check that cannot go red is not a check.
      # Verified by negative control: at 99 it exits 1, at 97 it exits 0.
      - run: |
          cargo llvm-cov --workspace --all-features --no-fail-fast \
            --ignore-filename-regex '(^|/)src/(main\.rs|bin/)' \
            --fail-under-lines 97 \
            --lcov --output-path lcov.info
      - name: Coverage report is non-empty
        run: |
          # An empty or crate-less LCOV renders as a green check over nothing.
          # Read the artifact, not the summary line.
          test -s lcov.info || { echo "::error::lcov.info is empty"; exit 1; }
          grep -q 'peira' lcov.info || {
            echo "::error::lcov.info contains no record for peira"; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lcov
          path: lcov.info
